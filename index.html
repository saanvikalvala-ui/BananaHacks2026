<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprint Studio</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header class="hero"><div class="logo">📐</div><h1>Blueprint Studio</h1><p>Describe a building. Watch it appear as a blueprint and a finished design.</p></header>
<main class="grid">
<section class="panel">
<div class="card"><h2>1 · Describe it</h2>
<textarea id="desc">A modern two-story house with 4 bedrooms, 3 bathrooms, a garage and a flat roof, gray walls.</textarea>
<div class="chips" id="chips"></div><button class="go" id="go">✨ Generate design</button></div>
<div class="card"><h2>2 · Fine-tune</h2>
<div class="ctl"><span>🏢 Floors</span><div class="st"><button data-k="floors" data-d="-1">−</button><b id="v-floors"></b><button data-k="floors" data-d="1">+</button></div></div>
<div class="ctl"><span>🛏️ Bedrooms</span><div class="st"><button data-k="beds" data-d="-1">−</button><b id="v-beds"></b><button data-k="beds" data-d="1">+</button></div></div>
<div class="ctl"><span>🛁 Bathrooms</span><div class="st"><button data-k="baths" data-d="-1">−</button><b id="v-baths"></b><button data-k="baths" data-d="1">+</button></div></div>
<div class="tgs"><label class="tg"><input type="checkbox" id="t-garage"><span>🚗 Garage</span></label><label class="tg"><input type="checkbox" id="t-office"><span>💻 Office</span></label></div>
<div class="lbl">Style</div><div class="styles" id="styles"></div>
<div class="lbl">Roof</div><div class="seg"><button data-roof="flat">Flat</button><button data-roof="gable">Gable</button><button data-roof="hip">Hip</button></div>
<div class="lbl">Wall color</div><div class="sws" id="sws"></div></div>
</section>
<section>
<div class="stats" id="stats"></div>
<div class="card"><div class="tabs"><button data-tab="look">🏠 Overall look</button><button data-tab="plan">📐 Blueprint</button><button data-tab="3d">🧊 3D view</button></div>
<div id="view"></div><div class="info" id="info"></div></div>
<p class="note">Concept drawings generated from your description. Not construction-ready plans.</p>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body></html>
